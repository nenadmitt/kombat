<style>
  :root {
    --bg: #08080B; --surface: #111116; --surfaceMuted: #17171D;
    --cardBorder: rgba(255,255,255,0.08); --accent: #7C5CFF; --onAccent: #0A0A0C;
    --accentSoft: rgba(124,92,255,0.14); --accentBorder: rgba(124,92,255,0.40);
    --textPrimary: #F5F5F7; --textSecondary: #9A9AA8; --textMuted: #6E6E7C; --textFaint: #45454F;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #000; color: var(--textPrimary);
    font-family: system-ui, -apple-system, sans-serif; padding: 28px 16px; }
  .frame { max-width: 380px; margin: 0 auto; }
  .note { color: var(--textMuted); font-size: 12px; text-align: center; margin: 0 0 18px; }
  .sheet { background: var(--surface); border: 1px solid var(--cardBorder);
    border-radius: 26px; padding: 22px 18px 26px; }
  .sheet + .sheet { margin-top: 20px; }
  .caption { color: var(--textMuted); font-size: 11px; text-align: center; margin: 0 0 14px;
    letter-spacing: 1px; text-transform: uppercase; }
  .label { color: var(--textMuted); font-family: var(--mono); font-size: 11px;
    letter-spacing: 2px; text-transform: uppercase; margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .chip { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 4px; border-radius: 12px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--cardBorder); }
  .chip.active { background: var(--accent); border-color: var(--accent); }
  .chip.disabled { opacity: 0.45; }
  .chip .name { font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--textSecondary); }
  .chip.active .name { color: var(--onAccent); font-weight: 700; }
  .chip.disabled .name { color: var(--textFaint); }
  .soon { font-family: var(--mono); font-weight: 700; font-size: 8px; letter-spacing: 1px; color: var(--textFaint); }
  .nostake { display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 7px; padding: 13px; border-radius: 12px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--cardBorder); }
  .nostake.active { background: var(--accent); border-color: var(--accent); }
  .nostake .name { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--textSecondary); }
  .nostake.active .name { color: var(--onAccent); font-weight: 700; }
  svg { display: block; }
</style>

<div class="frame">
  <p class="note">Create Game Room &middot; Asset selector preview (dark theme, app tokens)</p>

  <!-- STATE A: a coin selected (KOMBAT) -->
  <div class="sheet">
    <p class="caption">USDC selected</p>
    <p class="label">Asset</p>
    <div class="row">
      <div class="chip active" id="a-usdc"></div>
      <div class="chip" id="a-kombat"></div>
      <div class="chip" id="a-eth"></div>
      <div class="chip disabled" id="a-usdt"></div>
    </div>
    <div class="nostake" id="a-nostake"></div>
  </div>

  <!-- STATE B: No Stake selected -->
  <div class="sheet">
    <p class="caption">No Stake selected</p>
    <p class="label">Asset</p>
    <div class="row">
      <div class="chip" id="b-usdc"></div>
      <div class="chip" id="b-kombat"></div>
      <div class="chip" id="b-eth"></div>
      <div class="chip disabled" id="b-usdt"></div>
    </div>
    <div class="nostake active" id="b-nostake"></div>
  </div>
</div>

<script>
  // Brand marks copied from src/components/BrandIcon.tsx (same paths/colors).
  const S = 22;
  function svg(vb, inner, size) {
    return `<svg width="${size||S}" height="${size||S}" viewBox="${vb}">${inner}</svg>`;
  }
  const marks = {
    usdc: svg('0 0 32 32', `
      <circle cx="16" cy="16" r="16" fill="#2775CA"/>
      <path fill="#fff" d="M20.5 18.5c0-2.4-1.4-3.2-4.3-3.5-2-.3-2.4-.8-2.4-1.7 0-.9.6-1.5 2-1.5 1.2 0 1.8.4 2.1 1.4.1.2.3.3.5.3h1c.3 0 .5-.2.5-.5v-.1c-.2-1.3-1.3-2.3-2.6-2.4V9c0-.3-.2-.5-.5-.5h-1c-.3 0-.5.2-.5.5v1c-2 .3-3.2 1.6-3.2 3.2 0 2.3 1.4 3.1 4.2 3.4 1.9.3 2.5.7 2.5 1.8s-1 1.8-2.3 1.8c-1.8 0-2.4-.8-2.6-1.8-.1-.3-.3-.4-.5-.4h-1c-.3 0-.5.2-.5.5v.1c.3 1.6 1.3 2.7 3.4 3v1c0 .3.2.5.5.5h1c.3 0 .5-.2.5-.5v-1c2-.3 3.3-1.7 3.3-3.4z"/>
      <path fill="#fff" d="M13 25.5c-5.2-1.9-7.9-7.7-6-12.9 1-2.8 3.2-5 6-6 .3-.1.4-.3.4-.6v-.9c0-.3-.1-.5-.4-.6-.1 0-.3 0-.4.1-6.3 2-9.8 8.7-7.8 15 1.2 3.7 4.1 6.6 7.8 7.8.3.1.6-.1.7-.4.1-.1.1-.2.1-.4v-.9c0-.2-.2-.5-.4-.6zm6.4-20.9c-.3-.1-.6.1-.7.4-.1.1-.1.2-.1.4v.9c0 .3.2.6.4.7 5.2 1.9 7.9 7.7 6 12.9-1 2.8-3.2 5-6 6-.3.1-.4.3-.4.6v.9c0 .3.1.5.4.6.1 0 .3 0 .4-.1 6.3-2 9.8-8.7 7.8-15-1.2-3.8-4.2-6.7-7.8-7.9z"/>`),
    kombat: svg('0 0 24 24', `
      <path d="M12 1.5 L22 12 L12 22.5 L2 12 Z" fill="#FBBF24"/>
      <path d="M12 1.5 L22 12 L12 12 Z M2 12 L12 12 L12 22.5 Z" fill="#000" opacity="0.12"/>`),
    eth: svg('0 0 24 24', `
      <path d="M11.944 17.97 4.58 13.62 11.943 24l7.37-10.38-7.372 4.35z" fill="#627EEA" opacity="0.6"/>
      <path d="M12.056 0 4.69 12.223l7.365 4.354 7.365-4.35z" fill="#627EEA"/>`),
    usdtGrey: svg('0 0 32 32', `
      <circle cx="16" cy="16" r="16" fill="#45454F"/>
      <path fill="#08080B" d="M17.9 17.3c-.1 0-.7.1-2 .1-1 0-1.8 0-2 0-3.5-.1-6-.7-6-1.5s2.6-1.4 6-1.5v2.4c.2 0 1 .1 2 .1 1.2 0 1.8-.1 1.9-.1v-2.4c3.4.1 6 .7 6 1.5s-2.5 1.4-5.9 1.5zm0-3.2v-2.2h5V8.6H9.1v3.3h5v2.2c-4.1.2-7.2 1-7.2 2s3.1 1.8 7.2 2v7h3.8v-7c4.1-.2 7.2-1 7.2-2s-3.1-1.8-7.2-2z"/>`),
  };
  // lucide "sparkles", stroke follows currentColor.
  function sparkles(color) {
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>`;
  }
  function coin(el, mark, label, opts) {
    opts = opts || {};
    document.getElementById(el).innerHTML =
      mark + `<span class="name">${label}</span>` + (opts.soon ? '<span class="soon">SOON</span>' : '');
  }
  ['a','b'].forEach(p => {
    coin(p+'-usdc', marks.usdc, 'USDC');
    coin(p+'-kombat', marks.kombat, 'KOMBAT');
    coin(p+'-eth', marks.eth, 'ETH');
    coin(p+'-usdt', marks.usdtGrey, 'USDT', {soon:true});
  });
  document.getElementById('a-nostake').innerHTML = '<span class="name">No Stake</span>';
  document.getElementById('b-nostake').innerHTML = '<span class="name">No Stake</span>';
</script>
