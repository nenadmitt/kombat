# Explicit project name: without it Compose derives one from the parent
# directory ("server"), which collided with an unrelated repo's stack and
# merged both under a single project.
name: kombat-server

services:
  postgres:
    image: postgres:18
    container_name: gaming-platform-postgres
    restart: always
    environment:
      POSTGRES_DB: gaming_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - '5433:5432'
    volumes:
      # Postgres 18's image expects a single mount at /var/lib/postgresql
      # (it manages the version-specific subdirectory itself) rather than
      # the old .../data mount point.
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: gaming-platform-redis
    restart: always
    ports:
      - '6380:6379'

volumes:
  postgres_data:
