name: publish-webgames-image

# Builds apps/webgames/Dockerfile (repo-root context - the lockfile lives
# there) and pushes it to the DigitalOcean registry with two tags: the
# shortened commit sha as the version, plus a moving :latest. Publishing is a
# deliberate act - run it from the Actions tab against whichever branch/commit
# should ship. The VITE_* values are inlined into the bundle at build time;
# the Dockerfile carries the Sepolia defaults, and the inputs below override
# them for a one-off build.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Platform API base URL
        default: https://api.playkombat.xyz
      chain_id:
        description: Chain the stake pot is deployed on
        default: '11155111'
      rpc_url:
        description: RPC endpoint for that chain
        default: https://ethereum-sepolia-rpc.publicnode.com
      explorer_url:
        description: Block explorer for that chain
        default: https://sepolia.etherscan.io

env:
  IMAGE: registry.digitalocean.com/kombat-registry/webgames

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A DigitalOcean API token authenticates as both username and password.
      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Version from commit sha
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/webgames/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
            ${{ env.IMAGE }}:latest
          # Public values, all of them - they end up in a bundle anyone can
          # read. The WalletConnect id lives in secrets only to keep it out of
          # the repo; without it the WalletConnect option is dead but injected
          # wallets still work.
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
            VITE_CHAIN_ID=${{ inputs.chain_id }}
            VITE_RPC_URL=${{ inputs.rpc_url }}
            VITE_EXPLORER_URL=${{ inputs.explorer_url }}
            VITE_WALLETCONNECT_PROJECT_ID=${{ secrets.WALLETCONNECT_PROJECT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
