name: publish-web-image

# Builds apps/web/Dockerfile (repo-root context - the lockfile lives there)
# and pushes it to the DigitalOcean registry with two tags: the shortened
# commit sha as the version, plus a moving :latest. Publishing is a deliberate
# act - run it from the Actions tab against whichever branch/commit should
# ship. The NEXT_PUBLIC_* values are baked into the client bundle at build
# time; the Dockerfile carries the Sepolia defaults.
on:
  workflow_dispatch:
    inputs:
      demo_app_url:
        description: Webgames demo app URL the hero button links to
        default: https://demo.playkombat.xyz
      site_url:
        description: Canonical origin, used for the link-preview image URL
        default: https://playkombat.xyz

env:
  IMAGE: registry.digitalocean.com/kombat-registry/webapp

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A DigitalOcean API token authenticates as both username and password.
      - uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Version from commit sha
        id: version
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_DEMO_APP_URL=${{ inputs.demo_app_url }}
            NEXT_PUBLIC_SITE_URL=${{ inputs.site_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
